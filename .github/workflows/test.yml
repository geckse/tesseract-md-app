name: Test

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

  e2e:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout app-specific Tesseract skills
        uses: actions/checkout@v6
        with:
          repository: geckse/tesseract-md-skills
          path: tesseract-skills

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build with electron-vite
        run: npx electron-vite build

      # Prefer the exact released CLI. Before that release exists, build the
      # configured CLI ref so cross-repository integration remains a real gate.
      - name: Download mdvdb CLI
        id: mdvdb
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/mdvdb-bin"
          cd "$RUNNER_TEMP/mdvdb-bin"
          gh release download "${{ vars.MDVDB_VERSION || 'v0.2.0' }}" -R geckse/markdown-vdb --pattern 'mdvdb-aarch64-apple-darwin'
          mv mdvdb-aarch64-apple-darwin mdvdb
          chmod +x mdvdb
          ./mdvdb --version
          echo "$RUNNER_TEMP/mdvdb-bin" >> "$GITHUB_PATH"

      - name: Checkout mdvdb CLI source fallback
        if: steps.mdvdb.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          repository: geckse/markdown-vdb
          ref: ${{ vars.MDVDB_REF || 'main' }}
          path: mdvdb-source

      - name: Install Rust toolchain for CLI source fallback
        if: steps.mdvdb.outcome == 'failure'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache CLI source fallback build
        if: steps.mdvdb.outcome == 'failure'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mdvdb-source -> target
          key: app-e2e-macos

      - name: Build mdvdb CLI source fallback
        if: steps.mdvdb.outcome == 'failure'
        working-directory: mdvdb-source
        run: |
          cargo build --locked --release
          mkdir -p "$RUNNER_TEMP/mdvdb-bin"
          cp target/release/mdvdb "$RUNNER_TEMP/mdvdb-bin/mdvdb"
          "$RUNNER_TEMP/mdvdb-bin/mdvdb" --version
          echo "$RUNNER_TEMP/mdvdb-bin" >> "$GITHUB_PATH"
          echo "::notice title=CLI source fallback::The configured release asset was unavailable, so E2E uses geckse/markdown-vdb@${{ vars.MDVDB_REF || 'main' }}."

      - name: Run integration tests with mdvdb
        run: npm run test:integration

      # No `playwright install` needed: playwright.config.ts defines a single
      # 'electron' project driven via _electron.launch(), which uses the
      # Electron binary from node_modules — no Playwright browsers required.
      - name: Run e2e tests
        run: npm run test:e2e

  # Windows is a release gate. VS 2022 is pinned because node-gyp 11 supports
  # Visual Studio 2019/2022, while the floating image may move to VS 2026.
  e2e-win:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout app-specific Tesseract skills
        uses: actions/checkout@v6
        with:
          repository: geckse/tesseract-md-skills
          path: tesseract-skills

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build with electron-vite
        run: npx electron-vite build

      - name: Download mdvdb CLI
        id: mdvdb
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/mdvdb-bin"
          cd "$RUNNER_TEMP/mdvdb-bin"
          gh release download "${{ vars.MDVDB_VERSION || 'v0.2.0' }}" -R geckse/markdown-vdb --pattern 'mdvdb-x86_64-pc-windows-msvc.exe'
          mv mdvdb-x86_64-pc-windows-msvc.exe mdvdb.exe
          ./mdvdb.exe --version
          echo "$RUNNER_TEMP/mdvdb-bin" >> "$GITHUB_PATH"

      - name: Checkout mdvdb CLI source fallback
        if: steps.mdvdb.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          repository: geckse/markdown-vdb
          ref: ${{ vars.MDVDB_REF || 'main' }}
          path: mdvdb-source

      - name: Install Rust toolchain for CLI source fallback
        if: steps.mdvdb.outcome == 'failure'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache CLI source fallback build
        if: steps.mdvdb.outcome == 'failure'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mdvdb-source -> target
          key: app-e2e-windows-x64

      - name: Build mdvdb CLI source fallback
        if: steps.mdvdb.outcome == 'failure'
        working-directory: mdvdb-source
        env:
          CXXFLAGS: /DMAP_FAILED=((void*)-1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --release --no-default-features
          if ($LASTEXITCODE -ne 0) { throw 'mdvdb Windows fallback build failed' }
          $destination = Join-Path $env:RUNNER_TEMP 'mdvdb-bin'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item 'target/release/mdvdb.exe' (Join-Path $destination 'mdvdb.exe') -Force
          & (Join-Path $destination 'mdvdb.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'mdvdb Windows fallback binary did not launch' }
          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Output "::notice title=CLI source fallback::The configured release asset was unavailable, so E2E uses geckse/markdown-vdb@${{ vars.MDVDB_REF || 'main' }}."

      - name: Run integration tests with mdvdb
        run: npm run test:integration

      - name: Run e2e tests
        run: npm run test:e2e

  # Linux is a release gate and runs on the oldest supported Ubuntu baseline.
  e2e-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout app-specific Tesseract skills
        uses: actions/checkout@v6
        with:
          repository: geckse/tesseract-md-skills
          path: tesseract-skills

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build with electron-vite
        run: npx electron-vite build

      - name: Download mdvdb CLI
        id: mdvdb
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/mdvdb-bin"
          cd "$RUNNER_TEMP/mdvdb-bin"
          gh release download "${{ vars.MDVDB_VERSION || 'v0.2.0' }}" -R geckse/markdown-vdb --pattern 'mdvdb-x86_64-unknown-linux-gnu'
          mv mdvdb-x86_64-unknown-linux-gnu mdvdb
          chmod +x mdvdb
          ./mdvdb --version
          echo "$RUNNER_TEMP/mdvdb-bin" >> "$GITHUB_PATH"

      - name: Checkout mdvdb CLI source fallback
        if: steps.mdvdb.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          repository: geckse/markdown-vdb
          ref: ${{ vars.MDVDB_REF || 'main' }}
          path: mdvdb-source

      - name: Install Rust toolchain for CLI source fallback
        if: steps.mdvdb.outcome == 'failure'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache CLI source fallback build
        if: steps.mdvdb.outcome == 'failure'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mdvdb-source -> target
          key: app-e2e-linux-x64

      - name: Build mdvdb CLI source fallback
        if: steps.mdvdb.outcome == 'failure'
        working-directory: mdvdb-source
        env:
          CXX: g++-12
        run: |
          "$CXX" --version
          cargo build --locked --release
          mkdir -p "$RUNNER_TEMP/mdvdb-bin"
          cp target/release/mdvdb "$RUNNER_TEMP/mdvdb-bin/mdvdb"
          "$RUNNER_TEMP/mdvdb-bin/mdvdb" --version
          echo "$RUNNER_TEMP/mdvdb-bin" >> "$GITHUB_PATH"
          echo "::notice title=CLI source fallback::The configured release asset was unavailable, so E2E uses geckse/markdown-vdb@${{ vars.MDVDB_REF || 'main' }}."

      - name: Run e2e tests
        run: xvfb-run --auto-servernum -- npm run test:e2e
