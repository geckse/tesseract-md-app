name: Build Electron App

on:
  push:
    tags:
      - 'v*'
  # Manual smoke builds default to one platform and use --publish never, so
  # packaging can be verified without cutting a release. Tag builds publish
  # signed macOS and Windows artifacts; Linux stays non-publishing until its
  # release/publishing policy is enabled explicitly.
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to smoke-test without publishing
        required: true
        default: mac
        type: choice
        options:
          - mac
          - win
          - linux
          - all
      sign_windows:
        description: Sign a manual Windows smoke build with Azure Artifact Signing
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

  build:
    needs: checks
    # Two mac architectures are notarized sequentially. This is a final guard
    # above each submission's explicit 90-minute notary-service timeout.
    timeout-minutes: 210
    strategy:
      # One platform must never cancel another platform mid-signing/notarization.
      fail-fast: false
      matrix: >-
        ${{ fromJSON(
          github.event_name == 'push' &&
          '{"include":[{"os":"macos-latest","platform":"mac"},{"os":"windows-2022","platform":"win"}]}' ||
          github.event_name == 'workflow_dispatch' && inputs.platform == 'mac' &&
          '{"include":[{"os":"macos-latest","platform":"mac"}]}' ||
          github.event_name == 'workflow_dispatch' && inputs.platform == 'win' &&
          '{"include":[{"os":"windows-2022","platform":"win"}]}' ||
          github.event_name == 'workflow_dispatch' && inputs.platform == 'linux' &&
          '{"include":[{"os":"ubuntu-22.04","platform":"linux"}]}' ||
          '{"include":[{"os":"macos-latest","platform":"mac"},{"os":"windows-2022","platform":"win"},{"os":"ubuntu-22.04","platform":"linux"}]}'
        ) }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout app-specific Tesseract skills
        uses: actions/checkout@v4
        with:
          repository: geckse/tesseract-md-skills
          path: tesseract-skills

      # electron-builder resolves the shared umbrella layout from the app's
      # parent directory. Recreate that layout for this standalone checkout.
      - name: Stage bundled Tesseract skills
        shell: bash
        run: |
          set -euo pipefail
          test -f tesseract-skills/plugins/tesseract/.claude-plugin/plugin.json
          mkdir -p ../tesseract-skills/plugins
          cp -R tesseract-skills/plugins/tesseract ../tesseract-skills/plugins/
          test -f ../tesseract-skills/plugins/tesseract/.claude-plugin/plugin.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build with electron-vite
        run: npx electron-vite build

      # Signing/notarization secrets are scoped to the mac leg only.
      - name: Build Electron app (mac, signed + notarized)
        if: matrix.platform == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_RELEASE_BUILD: 'true'
          NOTARIZATION_TIMEOUT_MINUTES: '90'
        run: npx electron-builder --mac --publish ${{ github.event_name == 'workflow_dispatch' && 'never' || 'always' }}

      - name: Verify macOS release signature and notarization ticket
        if: matrix.platform == 'mac'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for app_path in dist/mac*/Tesseract.app; do
            test -f "$app_path/Contents/Resources/tesseract-skills/.claude-plugin/plugin.json"
            signature="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
            grep -F 'Authority=Developer ID Application:' <<<"$signature"
            grep -F "TeamIdentifier=${APPLE_TEAM_ID}" <<<"$signature"
            codesign --verify --deep --strict --verbose=2 "$app_path"
            xcrun stapler validate "$app_path"
            spctl --assess --type execute --verbose=4 "$app_path"
          done

      - name: Build Electron app (Windows unsigned smoke)
        if: >-
          matrix.platform == 'win' &&
          github.event_name == 'workflow_dispatch' &&
          !inputs.sign_windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config scripts/electron-builder.windows.cjs --win --x64 --publish never

      - name: Build Electron app (Windows signed)
        if: >-
          matrix.platform == 'win' &&
          (github.event_name == 'push' || inputs.sign_windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_RELEASE_BUILD: 'true'
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npx electron-builder --config scripts/electron-builder.windows.cjs --win --x64 --publish ${{ github.event_name == 'push' && 'always' || 'never' }}

      - name: Verify Windows NSIS and ZIP packages
        if: matrix.platform == 'win'
        env:
          REQUIRE_WINDOWS_SIGNATURE: ${{ github.event_name == 'push' || inputs.sign_windows }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        shell: pwsh
        run: |
          $arguments = @('-ArtifactDirectory', 'dist')
          if ($env:REQUIRE_WINDOWS_SIGNATURE -eq 'true') {
            $arguments += '-RequireSignature'
            $arguments += @('-ExpectedPublisher', $env:WINDOWS_PUBLISHER_NAME)
          }
          & scripts/verify-windows-artifacts.ps1 @arguments

      - name: Upload verified Windows packages
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: app-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

      - name: Build Electron app (Linux x64 smoke)
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --x64 --publish never

      - name: Verify Linux AppImage and deb on Ubuntu 22.04
        if: matrix.platform == 'linux'
        run: scripts/verify-linux-artifacts.sh dist amd64

      - name: Upload verified Linux packages
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: app-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux*.yml
          if-no-files-found: error
          retention-days: 7

  linux-ubuntu-24-smoke:
    name: Verify Linux packages on Ubuntu 24.04
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.platform == 'linux' || inputs.platform == 'all')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified Linux packages
        uses: actions/download-artifact@v4
        with:
          name: app-linux-x64
          path: dist

      - name: Install and launch deb on Ubuntu 24.04
        env:
          INSTALL_DEB: 'true'
        run: scripts/verify-linux-artifacts.sh dist amd64

  windows-clean-install-smoke:
    name: Verify Windows installer on a clean runner
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.platform == 'win' || inputs.platform == 'all'))
    needs: build
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified Windows packages
        uses: actions/download-artifact@v4
        with:
          name: app-windows-x64
          path: dist

      - name: Install and launch NSIS package
        env:
          REQUIRE_WINDOWS_SIGNATURE: ${{ github.event_name == 'push' || inputs.sign_windows }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
        shell: pwsh
        run: |
          $arguments = @('-ArtifactDirectory', 'dist', '-InstallNsis')
          if ($env:REQUIRE_WINDOWS_SIGNATURE -eq 'true') {
            $arguments += '-RequireSignature'
            $arguments += @('-ExpectedPublisher', $env:WINDOWS_PUBLISHER_NAME)
          }
          & scripts/verify-windows-artifacts.ps1 @arguments
